<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competent Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="home-link" class="reset-home"><span>Competent</span> Viewer</h1>
  <nav class="tabnav" id="tabnav">
    <button data-tab="competent" class="active">Métiers &amp; compétences</button>
    <button data-tab="talent">Référentiel Talent</button>
  </nav>
  <button id="refresh-btn" class="icon-btn" title="Charger un autre fichier" aria-label="Charger un autre fichier" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
      <polyline points="21 3 21 9 15 9"></polyline>
    </svg>
  </button>
  <span id="refresh-status" class="refresh-status"></span>
  <input id="header-file-input" type="file" accept=".xlsx" style="display:none;">
  <div class="langtoggle" id="langtoggle">
    <button data-lang="fr" class="active">FR</button>
    <button data-lang="nl">NL</button>
  </div>
</header>
<main id="app"></main>
<script src="vendor/xlsx.full.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
<script src="talent-parser.js"></script>
<script src="app-talent.js"></script>
<script src="app-shell.js"></script>
</body>
</html>
